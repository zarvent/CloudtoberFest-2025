</style></head><body><article id="29beed79-dd9f-8056-a5c0-d251e2998456" class="page sans"><header><img class="page-cover-image" src="https://images.unsplash.com/photo-1471421298428-1513ab720a8e?ixlib=rb-4.1.0&amp;q=85&amp;fm=jpg&amp;crop=entropy&amp;cs=srgb" style="object-position:center 50%"/><div class="page-header-icon page-header-icon-with-cover"><span class="icon">🍺</span></div><h1 class="page-title">Cloudtober Fest - Santa Cruz - 2025-10-29 </h1><p class="page-description"></p></header><div class="page-body"><figure id="29beed79-dd9f-8060-8fc1-ee20e202c77f" class="link-to-page"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/De%20Zero%20a%20Alta%20disponibilidad%20para%20HTTP%20con%20Terraf%2029beed79dd9f80608fc1ee20e202c77f.html"><span class="icon">🗣️</span>De Zero a Alta disponibilidad para HTTP con Terraform y AWS </a></figure><figure class="block-color-blue_background callout" style="white-space:pre-wrap;display:flex" id="29ceed79-dd9f-80cd-839e-f7dc1ca0f524"><div style="font-size:1.5em"><span class="icon">ℹ️</span></div><div style="width:100%"><h3 id="29beed79-dd9f-808a-9080-d8c04c5dc961" class="">👦🏻 Cesar Tablero</h3><p id="29ceed79-dd9f-8069-ab3f-eafa938a7b80" class="">Charla técnica de Cesar Tablero enfocada en implementar <strong>alta disponibilidad (HA)</strong> para servicios HTTP con <strong>Terraform y AWS</strong>. Explica por qué la HA es crucial para mantener los servicios de las compañías funcionales la mayor parte del tiempo. Detalla tres técnicas esenciales: <strong>replicación</strong>, <strong>balanceo de carga</strong> y <strong>redundancia</strong>. Para automatizar la creación y gestión de los recursos de infraestructura necesarios, el proyecto usa <strong>Infraestructura como Código (IaC)</strong> con Terraform. La charla incluye una <strong>demostración práctica</strong> de un grupo de autoescalamiento de AWS que utiliza alarmas de CloudWatch para crear automáticamente nuevas instancias según métricas de CPU, ilustrando la escalabilidad dinámica del sistema.</p><figure id="29beed79-dd9f-806d-b8c5-da06596ca2d3" class="image"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5284.jpeg"><img style="width:600px" src="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5284.jpeg"/></a></figure></div></figure><hr id="29beed79-dd9f-8035-9552-e1ad7bda4232"/><p id="29ceed79-dd9f-801a-8b23-ea89b5ae89c4" class="">
</p><figure id="29beed79-dd9f-807c-b4c3-d4c11375c401" class="link-to-page"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/Understanding%20AWS%20VPC%20A%20First%20Dive%20into%20Cloud%20Netw%2029beed79dd9f807cb4c3d4c11375c401.html"><span class="icon">🗣️</span>Understanding AWS VPC: A First Dive into Cloud Networking </a></figure><figure class="block-color-blue_background callout" style="white-space:pre-wrap;display:flex" id="29ceed79-dd9f-8015-98c5-df5aecab9756"><div style="font-size:1.5em"><span class="icon">ℹ️</span></div><div style="width:100%"><h3 id="29beed79-dd9f-8066-bd10-d3bfede6e350" class="">👦🏻 Carlos Isaac Jaldin Benavides</h3><p id="29ceed79-dd9f-808b-b872-d7d298483881" class="">Presentación técnica de Carlos Jaldin sobre los fundamentos de <strong>Amazon Web Services (AWS) networking</strong>. Carlos comienza presentándose y explica que su motivación es <strong>democratizar la educación</strong>, haciendo accesible información técnica que a menudo solo está disponible en inglés. El núcleo de la charla se centra en la <strong>Virtual Private Cloud (VPC)</strong>, conceptualizada como un &quot;condominio cerrado&quot; para recursos en la nube. Su propósito esencial es el aislamiento y la seguridad de recursos sensibles. La presentación cubre conceptos clave de red como el <strong>Classless Inter-Domain Routing (CIDR)</strong> y la distinción entre <strong>subnets públicas y privadas</strong>. También explica los diferentes componentes de enrutamiento: el <strong>Internet Gateway</strong> (comunicación bidireccional sin costo adicional) y el <strong>NAT Gateway</strong> (permite a recursos privados iniciar conexiones salientes a internet, pero tiene un costo).</p><figure id="29beed79-dd9f-807c-ac8c-c7621ce9d5f6" class="image"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5287.jpeg"><img style="width:600px" src="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5287.jpeg"/></a></figure></div></figure><hr id="29beed79-dd9f-80b8-9bac-fb43427852c0"/><p id="29ceed79-dd9f-80c9-b454-fc4d61a64976" class="">
</p><figure id="29beed79-dd9f-80ab-832d-fb089fe9701b" class="link-to-page"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/Crea%20tu%20propia%20web%20con%20S3%20en%20AWS%2029beed79dd9f80ab832dfb089fe9701b.html"><span class="icon">🗣️</span>Crea tu propia web con S3 en AWS</a></figure><figure class="block-color-blue_background callout" style="white-space:pre-wrap;display:flex" id="29ceed79-dd9f-80b2-8032-f141ea91a6a3"><div style="font-size:1.5em"><span class="icon">ℹ️</span></div><div style="width:100%"><h3 id="29beed79-dd9f-80c8-b5dd-ed01fa3a4580" class="">👧🏻 👧🏻 Dariana Pol Aramayo y Nicole Lozada Leon</h3><p id="29ceed79-dd9f-8034-9c32-c36416b1988c" class=""><strong>Charla técnica</strong> liderada por Dariana y Nicole, estudiantes y líderes en <strong>AWS (Amazon Web Services)</strong>, enfocada en crear <strong>páginas web estáticas con S3</strong>. Ambas son de la Universidad Católica y lideran el primer Cloud Club en Santa Cruz, promoviendo el conocimiento y la comunidad de AWS entre estudiantes. La charla explica el <strong>flujo de funcionamiento de una página web</strong>—desde la petición del usuario hasta la respuesta de AWS—y destaca la diferencia entre sitios web estáticos y dinámicos. El contenido principal incluye una demostración paso a paso sobre <strong>cómo crear y configurar un &quot;bucket&quot; de S3</strong>, que funciona como un contenedor único de archivos, y cómo ajustar los permisos para hacerlo público, permitiendo el alojamiento de sitios web sencillos y accesibles.</p><figure id="29ceed79-dd9f-8022-8046-ca7471ea115f" class="image"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5291.jpeg"><img style="width:600px" src="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5291.jpeg"/></a></figure><figure id="29ceed79-dd9f-80ee-b2c6-c71255ca049b" class="image"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5290.jpeg"><img style="width:600px" src="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/IMG_5290.jpeg"/></a></figure></div></figure><hr id="29beed79-dd9f-8093-98f7-da3a26cd523d"/><figure id="29beed79-dd9f-80b5-a8b0-fe8681b568e5" class="image"><a href="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/image.png"><img style="width:1281px" src="Cloudtober%20Fest%20-%20Santa%20Cruz%20-%202025-10-29/image.png"/></a></figure></div></article><span class="sans" style="font-size:14px;padding-top:2em"></span></body></html>
